project_id = "rqfqwavhtfwwtmfjnxkx"

[api]
  enabled = true
  extra_search_path = ["public", "extensions"]
  max_rows = 1000
  port = 54321
  schemas = ["public", "graphql_public"]

[auth]
  enabled = true

[edge_runtime]
  policy = "per_worker"

# Hosted schedules are installed with pg_cron by the external Supabase
# bootstrap migration. The official Supabase CLI does not deploy custom
# [[edge_runtime.cron]] entries from config.toml.

[functions]
  [functions.auth-email]
    verify_jwt = false
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.calculate-badges]
    verify_jwt = true
  [functions.cleanup-old-messages]
    verify_jwt = false
  [functions.create-tournament-checkout]
    verify_jwt = false
  [functions.delete-old-posts]
    verify_jwt = false
  [functions.get-biometric-credentials]
    verify_jwt = false
  [functions.notify-contested-match]
    verify_jwt = false
  [functions.process-email-queue]
    verify_jwt = false
  [functions.process-waitlist]
    verify_jwt = false
  [functions.purchase-division-slot]
    verify_jwt = false
  [functions.send-court-assignment]
    verify_jwt = true
  [functions.send-event-reminders]
    verify_jwt = false
  [functions.send-mfa-code]
    verify_jwt = true
  [functions.send-password-reset]
    verify_jwt = false
  [functions.send-tournament-notification]
    verify_jwt = false
  [functions.send-tournament-reminders]
    verify_jwt = false
  [functions.tournament-stripe-webhook]
    verify_jwt = false
  [functions.verify-biometric-auth]
    verify_jwt = false
  [functions.verify-mfa-code]
    verify_jwt = false

[functions.send-transactional-email]
# Server-only: the handler validates managed service/secret keys explicitly.
verify_jwt = false

[functions.push-send]
# Database-triggered requests authenticate with x-dispatch-secret in the handler.
verify_jwt = false

[functions.preview-transactional-email]
verify_jwt = true

[functions.handle-email-unsubscribe]
verify_jwt = false

[functions.handle-email-suppression]
verify_jwt = false
