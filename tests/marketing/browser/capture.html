<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PULSE · Screenshot studio</title>
<style>html,body{overflow:hidden}body{margin:0;min-height:844px;background:#30343a;font:14px system-ui;color:white}header{position:absolute;left:430px;top:24px;display:flex;gap:12px;align-items:center}select{padding:10px;color:black}iframe{position:absolute;left:0;top:0;display:block;border:0;width:390px;height:844px;background:#121c28}</style></head>
<body><header><label>Screen <select id="screen"><option value="app-home">App home</option><option value="friends">Friends</option><option value="chat">Chat</option><option value="communities">Communities</option><option value="profile">Profile</option><option value="round-robin">Round robin</option><option value="league">League</option><option value="assessment">Assessment</option><option value="home">Homepage</option><option value="home-dark">Homepage (dark)</option></select></label><label>Width <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1440</option></select></label></header>
<iframe title="Actual PULSE screen" src="/tests/marketing/browser/index.html?screen=app-home&dark&capture"></iframe>
<script>
const sources={
  ...Object.fromEntries(['app-home','friends','chat','communities','profile'].map(screen=>[screen,'/tests/marketing/browser/index.html?screen='+screen+'&dark&capture'])),
  'round-robin':'http://127.0.0.1:5208/tests/round-robin/event-browser/index.html?player&dark&capture',
  league:'/tests/marketing/browser/index.html?league&dark&capture',
  assessment:'http://127.0.0.1:5198/tests/skill/browser/index.html?capture',
  home:'/tests/marketing/browser/index.html','home-dark':'/tests/marketing/browser/index.html?dark'
};
document.querySelector('#screen').addEventListener('change',event=>{document.querySelector('iframe').src=sources[event.target.value]});
document.querySelector('#width').addEventListener('change',event=>{document.querySelector('iframe').style.width=event.target.value+'px'});
</script></body></html>
