apply plugin: 'com.android.application'

// Release signing — reads android/keystore.properties (gitignored) when present.
// CI writes this file from repository secrets; locally you create it once (see
// GOOGLE_PLAY_LAUNCH.md). Debug builds and `gradlew tasks` work without signing,
// but a release build must never silently produce an unsigned Play bundle.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.pulsepb.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pulsepb.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Historical defaults for local debug builds. Release workflow inputs
        // must exceed the highest uploaded Play version, including drafts;
        // workflow run numbers are not app versions.
        // (Single method call — avoids Groovy parsing `versionCode(x).toInteger()`.)
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "10")
        versionName (System.getenv("VERSION_NAME") ?: "1.0.9")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // Firebase dependencies
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
apply plugin: 'com.google.gms.google-services'

tasks.register('verifyPulseBackend', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/check-backend-artifact.mjs', '--native'
}
tasks.named('preBuild').configure { dependsOn 'verifyPulseBackend' }

tasks.register('verifyPulseSigning') {
    doLast {
        if (!hasKeystore || ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].any { !keystoreProperties[it] }) {
            throw new GradleException('Release signing is not configured. Use the Android release workflow with the existing PULSE upload key, or configure android/keystore.properties. Do not create a replacement key.')
        }
        if (!file(keystoreProperties['storeFile']).exists()) {
            throw new GradleException('The configured PULSE upload keystore does not exist. Check storeFile in android/keystore.properties.')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'verifyPulseSigning' }
