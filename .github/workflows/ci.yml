name: CI

# Build gate for pull requests. This is the status check that branch
# protection / auto-merge waits on before a PR can merge into main.
#
# Vite transpiles TypeScript; type checking and regression tests are separate
# gates. Lint still has an existing backlog outside these checks.

on:
  pull_request:
    branches: [main]
  # Also run on direct pushes to the working branch so the check is green
  # before a PR is even opened.
  push:
    branches: [pulse-reorg]

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # The committed npm lockfile is the canonical dependency graph.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Unit and database tests
        run: npm run test -- --maxWorkers=2

      - name: Production build
        run: npm run build
