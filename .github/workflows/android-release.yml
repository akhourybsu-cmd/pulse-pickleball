name: Android release (signed AAB → Play)

# Builds a SIGNED Android App Bundle and (optionally) uploads it to a Google
# Play track. Requires repository secrets (see GOOGLE_PLAY_LAUNCH.md):
#   ANDROID_KEYSTORE_BASE64     base64 of your upload keystore
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias (e.g. pulse-upload)
#   ANDROID_KEY_PASSWORD        key password
#   PLAY_SERVICE_ACCOUNT_JSON   (optional) service-account JSON for auto-upload
#
# The .aab is always produced as a downloadable artifact even if the Play
# upload secret is absent, so you can upload it manually the first time
# (Google requires the very first release of a new app to be created in the
# Play Console before the API will accept uploads).
#
# Run it: GitHub → Actions → "Android release (signed AAB → Play)" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "New version code, greater than every existing upload in Play Console"
        required: true
        type: string
      version_name:
        description: "Version shown to testers"
        required: true
        default: "1.1.0"
        type: string
      upload_to_play:
        description: "Upload to the named Play track (requires the Play service-account secret)"
        default: false
        type: boolean
      track:
        description: "Exact existing Play track ID; leave blank when only building a bundle"
        required: false
        type: string

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed AAB
    runs-on: ubuntu-latest
    # Surface the Play service-account secret as an env var so the upload step
    # can gate on it — the `secrets` context is NOT allowed in a step `if`.
    env:
      PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify production release target
        run: node scripts/check-production-release.mjs

      - name: Validate Android release inputs
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          UPLOAD_TO_PLAY: ${{ inputs.upload_to_play }}
          PLAY_TRACK: ${{ inputs.track }}
        run: node scripts/check-android-release.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify production backend connectivity
        run: npm run backend:health

      - name: Build web + sync into Android
        run: npm run cap:sync

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore keystore + signing config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — see GOOGLE_PLAY_LAUNCH.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/pulse-upload.keystore
          cat > android/keystore.properties <<EOF
          storeFile=pulse-upload.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed AAB
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: cd android && ./gradlew :app:bundleRelease --no-daemon

      - name: Verify bundle signature
        run: |
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$bundle" | tee /tmp/pulse-bundle-signature.txt
          grep -q 'jar verified' /tmp/pulse-bundle-signature.txt
          sha256sum "$bundle" > "$bundle.sha256"

      - name: Clean up secrets from workspace
        if: always()
        run: rm -f android/app/pulse-upload.keystore android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-${{ inputs.version_name }}-${{ inputs.version_code }}-release-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error

      - name: Recheck release before Play upload
        if: ${{ inputs.upload_to_play }}
        run: node scripts/check-production-release.mjs

      - name: Upload to Google Play
        if: ${{ inputs.upload_to_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SA }}
          packageName: com.pulsepb.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: completed
