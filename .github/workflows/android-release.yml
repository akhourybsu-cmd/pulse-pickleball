name: Android release (signed AAB → Play)

# Builds a SIGNED Android App Bundle and (optionally) uploads it to a Google
# Play track. Requires repository secrets (see GOOGLE_PLAY_LAUNCH.md):
#   ANDROID_KEYSTORE_BASE64     base64 of your upload keystore
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias (e.g. pulse-upload)
#   ANDROID_KEY_PASSWORD        key password
#   PLAY_SERVICE_ACCOUNT_JSON   (optional) service-account JSON for auto-upload
#
# The .aab is always produced as a downloadable artifact even if the Play
# upload secret is absent, so you can upload it manually the first time
# (Google requires the very first release of a new app to be created in the
# Play Console before the API will accept uploads).
#
# Run it: GitHub → Actions → "Android release (signed AAB → Play)" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to publish to (used only if the service-account secret is set)"
        default: internal
        type: choice
        options: [internal, alpha, beta, production]

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed AAB
    runs-on: ubuntu-latest
    # Surface the Play service-account secret as an env var so the upload step
    # can gate on it — the `secrets` context is NOT allowed in a step `if`.
    env:
      PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web + sync into Android
        run: npm run cap:sync

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore keystore + signing config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — see GOOGLE_PLAY_LAUNCH.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/pulse-upload.keystore
          cat > android/keystore.properties <<EOF
          storeFile=pulse-upload.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed AAB
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Clean up secrets from workspace
        if: always()
        run: rm -f android/app/pulse-upload.keystore android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload to Google Play
        if: ${{ env.PLAY_SA != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SA }}
          packageName: com.pulsepb.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: completed
