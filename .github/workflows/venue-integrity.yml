name: Check venue integrity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/check-venue-system.mjs
      - scripts/check-match-system.mjs
      - tests/venues/system-integrity.test.ts
      - .github/workflows/venue-integrity.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Read venue configuration and integrity counters
        run: node scripts/check-venue-system.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rqfqwavhtfwwtmfjnxkx
          VENUE_ID: d99d7de3-2431-4ee2-a826-04cc293da1cd

      - name: Read match record and rating consistency counters
        if: ${{ !cancelled() }}
        run: node scripts/check-match-system.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rqfqwavhtfwwtmfjnxkx
