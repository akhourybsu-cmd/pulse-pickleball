name: Deploy frontend to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "supabase/**"
      - "docs/**"
      - "**/*.md"

concurrency:
  group: firebase-production-hosting
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  backend:
    name: Prepare and verify backend
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTO_FRONTEND_DEPLOY == 'true' }}
    uses: ./.github/workflows/supabase-deploy.yml
    with:
      migration_mode: apply
      deploy_functions: true
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT_PULSE_PICKLEBALL_C60E1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PULSE_PICKLEBALL_C60E1 }}
  deploy:
    name: Build and deploy frontend
    needs: backend
    # AUTO_FRONTEND_DEPLOY is enabled only after a successful manual production deploy.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTO_FRONTEND_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Verify production release target
        run: node scripts/check-production-release.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: Verify production backend connectivity
        run: npm run backend:health

      - name: Build production frontend
        run: npm run build

      - name: Recheck release before publishing
        run: node scripts/check-production-release.mjs

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PULSE_PICKLEBALL_C60E1 }}
          channelId: live
          projectId: pulse-pickleball-c60e1

      - name: Verify live release
        run: node scripts/verify-live-backend.mjs
