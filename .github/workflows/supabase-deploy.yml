name: Deploy Supabase

# Production deployments use a project-scoped Supabase access token. Database
# migrations are applied through the Management API, so the database password
# never needs to be stored in GitHub. Pushes are enabled only when the
# repository variable AUTO_DB_PUSH is set to true; manual dry runs remain
# available even while automatic deployment is disabled.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "scripts/deploy-supabase-migrations.mjs"
      - "scripts/deploy-supabase-migrations.test.mjs"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:
    inputs:
      migration_mode:
        description: "Database migration mode"
        type: choice
        options:
          - plan
          - apply
        default: plan
      deploy_functions:
        description: "Also deploy edge functions"
        type: boolean
        default: false

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production backend
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTO_DB_PUSH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test migration runner
        run: node --test scripts/deploy-supabase-migrations.test.mjs

      - name: Determine deployment surfaces
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          DEPLOY_FUNCTIONS_INPUT: ${{ inputs.deploy_functions }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "deploy_functions=$DEPLOY_FUNCTIONS_INPUT" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- supabase/functions supabase/config.toml; then
            echo "deploy_functions=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_functions=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit pending migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_mode == 'plan' }}
        run: node scripts/deploy-supabase-migrations.mjs --dry-run

      - name: Apply pending migrations
        if: ${{ github.event_name == 'push' || inputs.migration_mode == 'apply' }}
        run: node scripts/deploy-supabase-migrations.mjs

      - name: Set up Supabase CLI
        if: ${{ steps.changes.outputs.deploy_functions == 'true' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        if: ${{ steps.changes.outputs.deploy_functions == 'true' }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
