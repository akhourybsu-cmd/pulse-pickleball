name: Deploy Supabase

# Production deployments use a project-scoped Supabase access token. Database
# migrations are applied through the Management API, so the database password
# never needs to be stored in GitHub. Pushes are enabled only when the
# repository variable AUTO_DB_PUSH is set to true; manual dry runs remain
# available even while automatic deployment is disabled.

on:
  workflow_call:
    inputs:
      migration_mode:
        type: string
        default: apply
      deploy_functions:
        type: boolean
        default: true
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true
      FIREBASE_SERVICE_ACCOUNT_PULSE_PICKLEBALL_C60E1:
        required: false
  schedule:
    # Weekly production drift and credential health check (Monday, 13:17 UTC).
    - cron: "17 13 * * 1"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "scripts/deploy-supabase-migrations.mjs"
      - "scripts/deploy-supabase-migrations.test.mjs"
      - "scripts/configure-venue-hosting*"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:
    inputs:
      migration_mode:
        description: "Database migration mode"
        type: choice
        options:
          - plan
          - apply
        default: plan
      deploy_functions:
        description: "Also deploy edge functions"
        type: boolean
        default: false

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production backend
    if: ${{ inputs.migration_mode != '' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || vars.AUTO_DB_PUSH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: rqfqwavhtfwwtmfjnxkx
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Verify production release target
        run: node scripts/check-production-release.mjs

      - name: Test migration runner
        run: node --test scripts/deploy-supabase-migrations.test.mjs scripts/configure-venue-hosting.test.mjs

      - name: Determine deployment surfaces
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          DEPLOY_FUNCTIONS_INPUT: ${{ inputs.deploy_functions }}
        run: |
          if [[ -n "$DEPLOY_FUNCTIONS_INPUT" ]]; then
            echo "deploy_functions=$DEPLOY_FUNCTIONS_INPUT" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            echo "deploy_functions=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- supabase/functions supabase/config.toml; then
            echo "deploy_functions=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_functions=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit pending migrations
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.migration_mode == 'plan') }}
        run: node scripts/deploy-supabase-migrations.mjs --dry-run

      - name: Check assessment release compatibility
        run: node scripts/check-assessment-release.mjs --preflight

      - name: Apply pending migrations
        if: ${{ github.event_name == 'push' || inputs.migration_mode == 'apply' }}
        run: |
          node scripts/check-production-release.mjs
          node scripts/deploy-supabase-migrations.mjs

      - name: Set up Supabase CLI
        if: ${{ steps.changes.outputs.deploy_functions == 'true' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        if: ${{ steps.changes.outputs.deploy_functions == 'true' }}
        run: |
          node scripts/check-production-release.mjs
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Configure venue hosting integration
        id: venue_hosting
        # Address requests can be queued before provider setup. A missing
        # optional provider credential must not block public pages or the app.
        continue-on-error: true
        if: ${{ steps.changes.outputs.deploy_functions == 'true' && (github.event_name == 'push' || inputs.migration_mode == 'apply') }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PULSE_PICKLEBALL_C60E1 }}
        run: |
          node scripts/check-production-release.mjs
          node scripts/configure-venue-hosting.mjs

      - name: Report pending venue hosting setup
        if: ${{ steps.venue_hosting.outcome == 'failure' }}
        run: |
          echo "::warning::Venue address requests are available, but automatic hosting setup still needs platform credential configuration. Addresses remain pending until verified."
          echo "Venue hosting credential setup needs attention. Check the Configure venue hosting integration step; no address has been marked connected by this deployment." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed assessment backend
        if: ${{ steps.changes.outputs.deploy_functions == 'true' }}
        run: node scripts/check-assessment-release.mjs
